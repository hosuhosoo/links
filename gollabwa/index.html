<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>불편수거함 상품 링크</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#16161a;--sub:#6b6b73;--line:#e6e6e2;--accent:#1b64da;--accent-ink:#fff;--note:#fff8e1;--note-ink:#6b5300}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--card:#1b1b20;--ink:#f1f1f3;--sub:#9a9aa3;--line:#2a2a31;--accent:#4c8dff;--accent-ink:#fff;--note:#2a2410;--note-ink:#e9d38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.disc{background:var(--note);color:var(--note-ink);font-size:13px;padding:10px 12px;border-radius:10px;margin:0 0 18px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:14px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.meta{color:var(--sub);font-size:12px;display:flex;gap:8px;align-items:center}
.no{font-weight:700;color:var(--accent)}
.title{font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.prod{color:var(--sub);font-size:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.buy{flex:1;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:11px 12px;border-radius:10px}
.vid{color:var(--sub);font-size:13px;text-decoration:none;padding:11px 6px}
.empty{color:var(--sub);text-align:center;padding:32px 0}
footer{color:var(--sub);font-size:12px;margin-top:24px;text-align:center}
</style></head>
<body><main>
<p class="disc">✱ 이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<h1>불편수거함</h1>
<p class="lead">쇼츠에 나온 상품 링크예요. 최신 영상이 맨 위에 있어요.</p>
<input id="q" type="search" placeholder="영상 제목이나 상품명으로 찾기" aria-label="검색">
<ol>
<li data-s="오징어 손질, 아직도 직접 하세요? 손질 냉동 오징어 후기 정리 간편한 손질 오징어 (냉동), 500g, 1개"><div class="meta"><span class="no">#1</span><span>11.18</span></div><p class="title">오징어 손질, 아직도 직접 하세요? 손질 냉동 오징어 후기 정리</p><p class="prod">간편한 손질 오징어 (냉동), 500g, 1개</p><div class="row"><a class="buy" href="https://link.coupang.com/a/iLUc2rJRNQ" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a><a class="vid" href="https://youtube.com/shorts/NbTBNclVsi4" target="_blank" rel="noopener">영상</a></div></li>
</ol>
<footer>@gollabwa · 가격·재고는 판매 페이지에서 확인해 주세요</footer>
</main><script>
const q=document.getElementById('q'),items=[...document.querySelectorAll('li[data-s]')];
q&&q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();items.forEach(li=>{li.hidden=v&&!li.dataset.s.includes(v)})});
</script></body></html>
